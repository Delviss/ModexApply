# Local development services. Production infrastructure is Terraform (infra/).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: modex
      POSTGRES_PASSWORD: modex
      POSTGRES_DB: modex
    ports: ['5432:5432']
    volumes: ['modex-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U modex']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage, so the signed-URL flow is exercised locally
  # exactly as it is in a deployed environment.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: modex
      MINIO_ROOT_PASSWORD: modex-local-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['modex-minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  modex-postgres:
  modex-minio:
