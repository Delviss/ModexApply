name: CI

# A red pipeline blocks merge (Phase 0 section 3.1). Every job here is a gate,
# not a report: nothing is `continue-on-error`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client
        run: pnpm --filter @modex/api prisma:generate
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  design-system:
    name: Design system gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Every approved colour pairing against its WCAG 2.2 minimum. A pairing
      # that is not declared in packages/ui/src/tokens/contrast.ts is not an
      # approved pairing.
      - name: Contrast budget
        run: pnpm test:contrast

      # Blocks sourced from 21st.dev arrive carrying their author's palette.
      # This is what proves the re-theme was finished rather than started.
      - name: No vendor colours outside the token layer
        run: pnpm check:vendor-hex

      # tokens.css is generated from palette.ts; a hand-edit would drift.
      - name: Design tokens are regenerated, not hand-edited
        run: |
          pnpm --filter @modex/ui build:tokens
          if ! git diff --quiet -- packages/ui/src/tokens/tokens.css; then
            echo "::error::tokens.css is out of date. Run: pnpm --filter @modex/ui build:tokens"
            git diff -- packages/ui/src/tokens/tokens.css
            exit 1
          fi

  security:
    name: Security gates
    runs-on: ubuntu-latest
    # CodeQL analysed every file happily and then failed on the upload, because
    # without an explicit block the job inherits whatever the repository's
    # default token permissions happen to be — which differ between a pull
    # request and a push, so the same commit passed on #11 and failed on main.
    # Stated here, the job behaves the same way wherever it runs.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan sees what a push would carry.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm check:secrets

      # Phase 7 (#9): "an alert with no runbook does not ship", enforced rather
      # than asserted. Also refuses an alert defined over a metric nothing
      # records — an alert that can never fire is worse than no alert, because
      # the dashboard looks covered.
      - name: Every alert has an owner and a runbook
        run: pnpm check:runbooks

      # Destructive migrations are refused unless they declare they have been
      # through expand/contract. Blue-green means old and new code share a
      # schema for minutes at a time.
      - name: Migration safety
        run: pnpm check:migrations

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Static analysis (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modex
          POSTGRES_PASSWORD: modex
          POSTGRES_DB: modex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U modex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://modex:modex@localhost:5432/modex_test
      JWT_SIGNING_KEY: ci-only-signing-key-at-least-32-characters
      MFA_SECRET_KEY: ci-only-mfa-sealing-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modex/api prisma:generate
      - run: pnpm --filter @modex/api prisma:migrate

      # These prove the guarantees the database enforces rather than the
      # application: append-only audit, the revocation cascade, and the
      # effective-dated timeline under a real transaction.
      - run: pnpm --filter @modex/api test:integration

      - name: Seed runs against a real schema
        run: pnpm --filter @modex/api seed

  performance:
    name: Search latency budget
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modex
          POSTGRES_PASSWORD: modex
          POSTGRES_DB: modex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U modex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://modex:modex@localhost:5432/modex_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modex/api prisma:generate
      - run: pnpm --filter @modex/api prisma:migrate

      # Phase 2 (#4) sets p95 < 500 ms for common catalogue queries and requires
      # the test in CI. The job prints the measured percentiles, so a run that
      # passes at 480 ms is visible before it becomes a run that fails.
      - run: pnpm --filter @modex/api test:performance

  journeys:
    name: Browser journeys and accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modex
          POSTGRES_PASSWORD: modex
          POSTGRES_DB: modex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U modex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://modex:modex@localhost:5432/modex
      REDIS_URL: redis://localhost:6379
      JWT_SIGNING_KEY: ci-only-signing-key-at-least-32-characters
      MFA_SECRET_KEY: ci-only-mfa-sealing-key-at-least-32-characters
      # No scanner in CI, which is the fail-closed setting: uploads stay
      # `pending` and nothing reaches a connector. The journeys do not upload.
      MALWARE_SCANNER: none
      API_ORIGIN: http://localhost:3001
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modex/api prisma:generate
      - run: pnpm --filter @modex/api prisma:migrate
      - run: pnpm --filter @modex/api seed
      - run: pnpm --filter @modex/api reindex
      - run: pnpm --filter @modex/ui build
      - run: pnpm --filter @modex/contracts build

      - name: Install Chromium
        run: pnpm --filter @modex/web exec playwright install --with-deps chromium

      # A real browser against a real stack. This is the only gate that can see
      # a page that throws after a successful step-up, or a control a screen
      # reader announces as "button" and nothing else.
      - name: Build and start the stack
        run: |
          pnpm --filter @modex/api build
          pnpm --filter @modex/web build
          pnpm --filter @modex/api start > /tmp/api.log 2>&1 &
          pnpm --filter @modex/web start > /tmp/web.log 2>&1 &
          npx --yes wait-on http://localhost:3001/v1/health/live http://localhost:3000 --timeout 180000

      - name: Core journeys, with axe (WCAG 2.2 AA)
        run: pnpm --filter @modex/web test:e2e

      - name: Server logs on failure
        if: failure()
        # `-n 100`, not `-100`: the obsolete form is rejected outright when more
        # than one file is named, so the diagnostic step failed instead of
        # printing the diagnosis.
        run: tail -n 100 /tmp/api.log /tmp/web.log

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modex/api prisma:generate
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
      # No API origin is set here on purpose: it is read at runtime, so a build
      # that needed it would be a build tied to one environment.
      - run: pnpm build
